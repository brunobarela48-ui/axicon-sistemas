# Dispara a busca de notícias 3x por dia (06h, 12h, 15h horário de Brasília).
# Brasil é UTC-3 fixo (sem DST), então UTC = BRT + 3.
#   06:00 BRT = 09:00 UTC
#   12:00 BRT = 15:00 UTC
#   15:00 BRT = 18:00 UTC
#
# GitHub Actions pode atrasar agendamentos em ~5-15min em horários de pico,
# então não trate esses horários como exatos.

name: Curadoria · busca automática

on:
  schedule:
    - cron: '0 9 * * *'    # 06:00 BRT
    - cron: '0 15 * * *'   # 12:00 BRT
    - cron: '0 18 * * *'   # 15:00 BRT
  workflow_dispatch:       # permite rodar manualmente pelo botão "Run workflow"

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar /api/curadoria/buscar
        env:
          ENDPOINT: ${{ vars.CURADORIA_ENDPOINT || 'https://intranet.axiconsolucoes.com/api/curadoria/buscar' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET não configurado no repositório."
            exit 1
          fi
          echo "Chamando $ENDPOINT"
          response=$(curl -sS -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            -w "\n---\nHTTP %{http_code} | %{time_total}s")
          echo "$response"
          # Falha o job se HTTP != 200
          echo "$response" | grep -q "HTTP 200" || { echo "::error::Endpoint retornou erro"; exit 1; }
